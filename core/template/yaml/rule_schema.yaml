$schema: "https://json-schema.org"
title: "Microcontroller Rule Configuration Schema"
type: "object"
required:
  - "rule"

properties:
  rule:
    type: "object"
    required:
      - "id"
      - "trigger"
      - "requires"
      - "completion"
      - "timeout"
      - "error"
      - "result"
    additionalProperties: false
    
    properties:
      id:
        type: "string"
        minLength: 1
        
      trigger:
        type: "array"
        minItems: 1
        items:
          type: "string"
          minLength: 1
          
      requires:
        type: "array"
        items:
          type: "string"
          minLength: 1
          
      completion:
        type: "array"
        minItems: 1
        items:
          type: "string"
          minLength: 1
          
      timeout:
        type: "string"
        minLength: 1
        description: "Allowed format examples: '100 us', '10 ms', '1 s', 'none', 'unknown'"
        
      error:
        type: "array"
        items:
          type: "string"
          minLength: 1
          
      result:
        type: "array"
        minItems: 1
        items:
          type: "string"
          minLength: 1
