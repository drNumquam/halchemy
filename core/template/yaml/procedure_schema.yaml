$schema: "https://json-schema.org"
title: "Microcontroller Procedure Configuration Schema"
type: "object"
required:
  - "procedure"

properties:
  procedure:
    type: "object"
    required:
      - "name"
      - "description"
      - "rules"
    additionalProperties: false
    
    properties:
      name:
        type: "string"
        minLength: 1
        
      description:
        type: "string"
        
      rules:
        type: "array"
        minItems: 1
        items:
          type: "object"
          required:
            - "id"
            - "keywords"
            - "yaml"
          additionalProperties: false
          properties:
            id:
              type: "string"
              minLength: 1
            keywords:
              type: "array"
              uniqueItems: true
              items:
                type: "string"
                minLength: 1
            yaml:
              type: "string"
              minLength: 1
