# TOC schema for PDF document section indexing.
# All child sections shall use the same schema as their parent section.

source: ''       # string: source PDF filename
pages:           # integer: otal number of pages in source PDF

sections:

  -id:           # integer: unique section identifier
   number: ''    # string: section number as displayed in PDF document
   title: ''     # string: section title as displayed in PDF document

   start_page:   # integer: first page of the section
   end_page:     # integer: last page of the section

   start_y:      # float: vertical coordinate where section starts
   end_y:        # float: vertical coordinate where section ends

   pdf: ''       # string: relative path of extracted section PDF

   keywords: []  # list[string]: keywords describing section content

   references:    # list[reference]: references (exact or semantic) to other sections
     - target_id: # integer: referenced section id

   children: []   # list[section]: child sections using the same schema
