$schema: 'https://json-schema.org/draft/2020-12/schema'
$title: 'Table of Contents (TOC)'
$comment: 'JSON Schema in YAML for validating toc.yaml data.'
type: object
additionalProperties: false
required:
  - source
  - pages
  - sections
properties:
  source:
    type: string
    description: 'Source PDF filename or path.'
  pages:
    type: integer
    minimum: 0
    description: 'Total number of pages in the source PDF.'
  sections:
    type: array
    description: 'Top-level sections in the document.'
    items:
      $ref: '#/$defs/section'
$defs:
  section:
    type: object
    additionalProperties: false
    required:
      - id
      - title
      - start_index
      - end_index
      - children
    properties:
      id:
        type: integer
        description: 'Integer identifier of this node or section.'
      title:
        type: string
        description: 'Title of the section.'
      start_index:
        type: integer
        minimum: 0
        description: 'Absolute or physical page index where the section starts.'
      end_index:
        type: integer
        minimum: 0
        description: 'Absolute or physical page index where the section ends.'
      children:
        type: array
        description: 'Nested sections with the same structure as their parent.'
        items:
          $ref: '#/$defs/section'
